<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5f8b">
  <title>سیویل‌دسک</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🏗️ سیویل‌دسک</div>
    <div class="today" id="today"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="view"></main>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h3 id="modal-title"></h3>
      <div id="modal-body" class="form-grid"></div>
      <p class="error" id="modal-error"></p>
      <div class="modal-actions">
        <button type="submit" class="btn primary" value="save">ذخیره</button>
        <button type="button" class="btn" id="modal-cancel">انصراف</button>
        <button type="button" class="btn danger" id="modal-delete">حذف</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
